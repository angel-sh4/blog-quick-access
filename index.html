<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>블로그 운영 시작 페이지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">BLOG OPERATIONS</p>
          <h1>블로그 관리 시작 페이지</h1>
        </div>
        <div class="date-box">
          <span>오늘</span>
          <strong id="todayDate">-</strong>
        </div>
      </header>

      <main class="dashboard">
        <section class="hero-panel">
          <div class="hero-copy">
            <p class="badge">Quick Access</p>
            <h2>블로그 운영에 필요한 핵심 사이트를 한 번에</h2>
            <p>
              네이버 서비스와 콘텐츠 툴을 바로 열어 편하게 작업할 수 있도록 구성한
              시작 페이지입니다.
            </p>
          </div>
          <div class="hero-actions">
            <a href="https://blog.naver.com/" target="_blank" rel="noreferrer">블로그 열기</a>
            <a href="https://ad.post.naver.com/" target="_blank" rel="noreferrer" class="secondary">애드포스트</a>
          </div>
        </section>

        <section class="shortcut-section">
          <div class="section-title-row">
            <h3>바로가기</h3>
            <span>필수 도구</span>
          </div>

          <div class="card-grid" id="shortcutGrid"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
